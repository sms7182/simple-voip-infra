name: VoIP SIP Server Tailscale CI

on:
  push:
    branches: [ "main", "master" ]
  workflow_dispatch: # Allows you to manually trigger it from the GitHub Actions tab!

jobs:
  test-sip-server:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Set up Go
        uses: actions/setup-go@v5
        with:
          go-version: '1.26.8'

      - name: Connect to Tailscale
        uses: tailscale/github-action@v2
        with:
          authkey: ${{ secrets.TS_AUTHKEY }}
          hostname: github-voip-runner
          # Ensures routing works correctly for UDP/SIP packets
          args: --advertise-tags=tag:container

      - name: Build and Start Docker Container
        run: |
          # Build and start your service using Docker Compose
          docker compose up --build -d
          
          # Wait 3 seconds for the server to initialize
          sleep 3
          
          # Check logs
          docker logs go-sip-server

      - name: Print Tailscale IP & Keep Alive for Testing
        run: |
          echo "===================================================="
          echo "Tailscale is connected!"
          echo "Find your GitHub runner's Tailscale IP address above"
          echo "or look in your Tailscale admin panel for 'github-voip-runner'."
          echo "You have 10 minutes to test from your phone!"
          echo "===================================================="
          
          # Keep the workflow alive for 10 minutes (600 seconds) so you can test
          sleep 600

      - name: Teardown Docker Compose
        if: always()
        run: |
          docker compose down